# T1 - the recovery-manipulation dilemma. Every defender (trust model + selection policy, with
# its memory knob swept) meets 3 honest (0.9) and 4 malicious (0.05) providers plus three
# "special" ones, depending on the scenario:
#   sleeper     good (0.95), abruptly bad (0.05) from round 300       -> needs a fast exit
#   recovering  bad (0.05), abruptly good (0.97) from round 300       -> needs readmission
#   stationary  good (0.95) throughout                                -> cost in a benign world
#   onoff[...]  0.9 for `good` rounds, then 0.05 for `bad` rounds, repeating, 3 staggered
#               attackers; analysis takes each defender's worst schedule (best response)
# Paired within each scenario (CRN). Analyse with scripts/t1_frontier.py.
name: t1_frontier
n_rounds: 2000
n_clients: 20
seeds: {start: 0, stop: 30}
trajectories: false
n_boot: 2000
readmission_level: 0.5

scenarios:
  - name: sleeper
    providers:
      - {type: honest, count: 3, p: 0.9}
      - {type: degrading, count: 3, p_start: 0.95, p_end: 0.05, onset: 300, rate: .inf}
      - {type: malicious, count: 4, p: 0.05}
  - name: recovering
    providers:
      - {type: honest, count: 3, p: 0.9}
      - {type: recovering, count: 3, p_start: 0.05, p_end: 0.97, onset: 300, rate: .inf}
      - {type: malicious, count: 4, p: 0.05}
  - name: stationary
    providers:
      - {type: honest, count: 3, p: 0.9}
      - {type: honest, count: 3, p: 0.95}
      - {type: malicious, count: 4, p: 0.05}
  - name: onoff
    providers:
      - {type: honest, count: 3, p: 0.9}
      - {type: onoff, count: 3, p_on: 0.9, p_off: 0.05, good: 50, bad: 10, stagger: true}
      - {type: malicious, count: 4, p: 0.05}
    grid:
      providers.1.good: [10, 25, 50, 100, 200, 400]
      providers.1.bad: [5, 10, 25, 50]

conditions:
  # v1 additive rule (saturating, asymmetric); the penalty P sets how hard a failure hits
  - name: add_greedy
    trust: {type: asymmetric, reward: 0.1, penalty: 0.2}
    selection: {type: greedy}
    grid: {trust.penalty: [0.1, 0.15, 0.2, 0.3, 0.4, 0.6, 0.8]}
  - name: add_eps
    trust: {type: asymmetric, reward: 0.1, penalty: 0.2}
    selection: {type: epsilon_greedy, epsilon: 0.05}
    grid: {trust.penalty: [0.1, 0.2, 0.4, 0.8]}

  # Beta reputation with per-interaction forgetting (reputation-system style)
  - name: beta_greedy
    trust: {type: beta, forgetting: 0.9}
    selection: {type: greedy}
    grid: {trust.forgetting: [0.7, 0.8, 0.9, 0.95, 0.98, 1.0]}
  - name: beta_eps
    trust: {type: beta, forgetting: 0.9}
    selection: {type: epsilon_greedy, epsilon: 0.05}
    grid: {trust.forgetting: [0.7, 0.8, 0.9, 0.95, 0.98, 0.995, 1.0]}
  - name: beta_ts
    trust: {type: beta, forgetting: 0.9}
    selection: {type: thompson}
    grid: {trust.forgetting: [0.7, 0.8, 0.9, 0.95, 0.98, 0.995, 1.0]}

  # asymmetric forgetting: successes are forgotten faster than failures
  - name: asymforget_eps
    trust: {type: beta, forgetting: 0.8, forgetting_fail: 0.99}
    selection: {type: epsilon_greedy, epsilon: 0.05}
    grid: {trust.forgetting: [0.8, 0.9, 0.95], trust.forgetting_fail: [0.99, 0.999]}
  - name: asymforget_ts
    trust: {type: beta, forgetting: 0.8, forgetting_fail: 0.99}
    selection: {type: thompson}
    grid: {trust.forgetting: [0.8, 0.9, 0.95], trust.forgetting_fail: [0.99, 0.999]}

  # non-stationary bandits (memory counted in rounds): discounted TS, D-UCB, SW-TS, SW-UCB
  - name: dts
    trust: {type: beta, forgetting: 0.99, discount: time}
    selection: {type: thompson}
    grid: {trust.forgetting: [0.95, 0.98, 0.99, 0.995, 0.999]}
  - name: ducb
    trust: {type: beta, forgetting: 0.99, discount: time}
    selection: {type: ucb, c: 1.0}
    grid: {trust.forgetting: [0.98, 0.99, 0.995, 0.999, 1.0]}
  - name: swts
    trust: {type: window, window: 100, mode: time}
    selection: {type: thompson}
    grid: {trust.window: [25, 50, 100, 200, 400]}
  - name: swucb
    trust: {type: window, window: 100, mode: time}
    selection: {type: ucb, c: 1.0}
    grid: {trust.window: [50, 100, 200, 400, 800]}

  # change detection with local restarts (CUSUM): standard two-sided vs drop-only
  - name: cusum_ts
    trust: {type: cusum, sides: both, threshold: 4.0}
    selection: {type: thompson}
    grid: {trust.sides: [both, down], trust.threshold: [2.0, 4.0, 8.0]}
  - name: cusum_ucb
    trust: {type: cusum, sides: both, threshold: 4.0}
    selection: {type: ucb, c: 1.0}
    grid: {trust.sides: [both, down], trust.threshold: [2.0, 4.0, 8.0]}
