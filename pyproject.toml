[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrss"
version = "2.0.0"
description = "Multi-Agent Trust and Reputation Simulation System: decentralized trust under adversarial and non-stationary providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Naina Warjurkar"}]
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
matrss = "matrss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
